# Streamlit theme + server config (used locally and on Streamlit Community Cloud)
[theme]
# "Editorial lab": warm paper and ink (the CSS in main() does the rest)
base = "light"
primaryColor = "#1F1D1A"
backgroundColor = "#F7F5F0"
secondaryBackgroundColor = "#EFEBE3"
textColor = "#1F1D1A"
font = "sans serif"

[server]
maxUploadSize = 50          # MB — for the Excel upload & retrain panel

[browser]
gatherUsageStats = false
