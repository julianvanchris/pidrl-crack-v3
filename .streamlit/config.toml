# Streamlit theme + server config (used locally and on Streamlit Community Cloud)
[theme]
base = "dark"
primaryColor = "#E8EDF4"
backgroundColor = "#111926"
secondaryBackgroundColor = "#1F2A3C"
textColor = "#E8EDF4"
font = "sans serif"

[server]
maxUploadSize = 50          # MB — for the Excel upload & retrain panel

[browser]
gatherUsageStats = false
