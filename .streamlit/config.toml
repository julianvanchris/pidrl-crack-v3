# Streamlit theme + server config (used locally and on Streamlit Community Cloud)
[theme]
base = "dark"
primaryColor = "#5b8cff"
backgroundColor = "#060c1a"
secondaryBackgroundColor = "#0e1c34"
textColor = "#eaf1ff"
font = "sans serif"

[server]
maxUploadSize = 50          # MB — for the Excel upload & retrain panel

[browser]
gatherUsageStats = false
