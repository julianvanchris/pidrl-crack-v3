<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Line studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Line studio: the production line as a live 3D scene. Same "cold room" tokens
   as the dashboard; the only warm colours are real temperatures. */
:root{
  --night:#111926; --deck:#172131; --deck2:#1F2A3C;
  --frost:#E8EDF4; --frost2:#B0BACB; --frost3:#7E8AA0;
  --rule:rgba(205,219,240,.10); --rule2:rgba(205,219,240,.18);
  --glass:rgba(14,21,32,.66); --hot:#DD6A3A;
  --font:Archivo,"BIZ UDPGothic","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;color:var(--frost);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.stage{position:relative;height:var(--h,600px);border-radius:20px;overflow:hidden;isolation:isolate;
  user-select:none;-webkit-user-select:none;
  background:radial-gradient(64% 56% at 52% 40%,rgba(95,155,211,.09),transparent 72%),
             radial-gradient(130% 110% at 50% 0%,#1B2638 0%,#131B28 58%,#0D131D 100%);
  box-shadow:inset 0 0 0 1px rgba(205,219,240,.08)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;
  cursor:grab;outline:none}
canvas.grabbing{cursor:grabbing}
canvas.hand{cursor:pointer}
.labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;line-height:1.3;visibility:hidden;
  color:var(--frost2);text-align:center;will-change:transform;
  text-shadow:0 1px 2px rgba(8,12,18,.95),0 0 10px rgba(8,12,18,.85)}
.lbl b{display:block;color:var(--frost);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.lbl.zone{padding-bottom:6px;border-bottom:1px solid rgba(205,219,240,.28)}
.lbl.hero{color:var(--frost);font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px;
  background:var(--glass);border:1px solid var(--rule2);font-variant-numeric:tabular-nums}
.lbl.burst{color:var(--frost);font-size:11.5px;padding:4px 9px;border-radius:7px;
  background:rgba(14,21,32,.82);border:1px solid rgba(221,106,58,.55)}
.lbl[hidden]{display:none}

/* Read-out of the stick under the probe */
.probe{position:absolute;top:16px;left:16px;z-index:3;min-width:196px;padding:12px 15px 11px;pointer-events:none;
  border-radius:14px;background:var(--glass);border:1px solid var(--rule);
  -webkit-backdrop-filter:blur(14px) saturate(130%);backdrop-filter:blur(14px) saturate(130%)}
.p-k{color:var(--frost3);font-size:11.5px}
.p-t{display:flex;align-items:baseline;gap:6px;margin:2px 0 11px}
.p-t b{font-size:34px;font-weight:600;font-stretch:118%;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.p-t span{color:var(--frost3);font-size:13px}
.p-g{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;font-size:12.5px}
.p-g dt{color:var(--frost3)}
.p-g dd{margin:0;text-align:right;color:var(--frost);font-variant-numeric:tabular-nums;white-space:nowrap}
.p-g dd i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px}
.p-g dd small{color:var(--frost3);font-size:11px;margin-left:6px}
.p-s{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:9px;
  border-top:1px solid var(--rule);font-size:12px;color:var(--frost2)}
.p-s::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--frost3);flex-shrink:0}
.p-s.crack{color:#F1D7A0}
.p-s.crack::before{background:#E9C46A}
.p-s.hot{color:#F2C7A3}
.p-s.hot::before{background:var(--hot);box-shadow:0 0 9px var(--hot);animation:beat 1s ease-in-out infinite}

/* Views and colour scale */
.views{position:absolute;top:16px;right:16px;z-index:3;display:flex;flex-direction:column;
  align-items:flex-end;gap:10px}
.seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--glass);
  border:1px solid var(--rule);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.seg button{border:0;background:transparent;color:var(--frost3);font-size:12.5px;font-weight:550;
  padding:6px 13px;border-radius:999px;cursor:pointer;transition:background .18s,color .18s}
.seg button:hover{color:var(--frost)}
.seg button[aria-pressed="true"]{background:var(--frost);color:var(--night)}
.scale{display:flex;align-items:center;gap:7px;color:var(--frost3);font-size:11px;
  font-variant-numeric:tabular-nums}
.scale i{width:96px;height:5px;border-radius:3px}
/* Compare: run the line as your recipe, the worst case or the best option */
.cmp{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:3;display:flex;
  flex-direction:column;align-items:center;gap:6px;max-width:48%}
.cmp[hidden]{display:none}
.cmp .seg button{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.cmp .seg button i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cmp .seg button b{font-weight:600;font-variant-numeric:tabular-nums}
.cmp p{margin:0;font-size:11.5px;color:var(--frost2);text-align:center;
  text-shadow:0 1px 2px rgba(8,12,18,.95)}
@media (max-width:1100px){
  .cmp{top:60px;left:auto;right:16px;transform:none;align-items:flex-end;max-width:62%}
  .cmp p{text-align:right}
  .scale{display:none}
}

/* Dock: play, the thermal track (which is also the timeline), add burst */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:3;display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:46px 18px 14px;
  background:linear-gradient(180deg,transparent,rgba(13,19,29,.78) 44%,rgba(13,19,29,.93))}
.play{width:42px;height:42px;border-radius:50%;border:1px solid var(--rule2);
  background:rgba(232,237,244,.06);display:grid;place-items:center;cursor:pointer;transition:background .16s}
.play:hover{background:rgba(232,237,244,.14)}
.play svg{width:14px;height:14px;fill:var(--frost)}
.track{position:relative;height:92px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
/* Damage lane: damage index over the cycle; dashed line = 0.25, where cracks start */
.tk-d{position:absolute;left:0;right:0;top:20px;height:18px}
.tk-d svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tk-d span{position:absolute;left:0;top:-2px;font-size:9.5px;color:var(--frost3);pointer-events:none}
.tk-b{position:absolute;left:0;right:0;top:0;height:16px}
.bk{position:absolute;top:4px;height:8px;border-radius:3px;background:var(--hot);
  box-shadow:0 0 10px rgba(221,106,58,.55)}
.bk.ed{top:0;height:16px;cursor:grab;outline:none}
.bk.ed:hover,.bk.ed:focus-visible{box-shadow:0 0 0 1.5px var(--frost),0 0 12px rgba(221,106,58,.7)}
.bk.sel{box-shadow:0 0 0 2px var(--frost),0 0 14px rgba(221,106,58,.8)}
/* Resize grip sits just outside the right edge, so a short burst can still be moved */
.bk .rz{position:absolute;left:100%;top:1px;bottom:1px;width:9px;margin-left:2px;cursor:ew-resize;
  border-radius:2px;opacity:0;transition:opacity .15s}
.bk .rz::after{content:"";position:absolute;left:3px;top:3px;bottom:3px;width:2px;border-radius:1px;background:var(--frost)}
.bk.ed:hover .rz,.bk.sel .rz{opacity:1}
.tk-band{position:absolute;left:0;right:0;top:42px;height:22px;border-radius:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -9px 16px rgba(0,0,0,.18);
  animation:pour 1.1s cubic-bezier(.2,.7,.1,1) both}
.tk-z{position:absolute;left:0;right:0;top:69px;height:23px}
.tk-z div{position:absolute;top:0;height:100%;padding-left:6px;border-left:1px solid var(--rule2);
  overflow:hidden;white-space:nowrap;font-size:10.5px;line-height:11.5px;color:var(--frost3)}
.tk-z b{display:block;color:var(--frost2);font-weight:550;font-size:11px;font-variant-numeric:tabular-nums}
.tk-h{position:absolute;top:-4px;height:73px;width:0;outline:none;pointer-events:none}
.tk-h::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;border-radius:1px;
  background:var(--frost)}
.tk-h i{position:absolute;left:-8px;top:49px;width:16px;height:16px;border-radius:50%;
  background:var(--frost);box-shadow:0 0 0 4px rgba(232,237,244,.16),0 2px 10px rgba(0,0,0,.4)}
.tk-h:focus-visible i{box-shadow:0 0 0 5px rgba(232,237,244,.45)}
.dock-r{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.add{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule2);background:transparent;
  color:var(--frost);border-radius:999px;padding:8px 14px 8px 11px;font-size:12.5px;font-weight:550;
  cursor:pointer;white-space:nowrap;transition:background .16s,border-color .16s}
.add:hover{background:rgba(232,237,244,.1);border-color:var(--frost3)}
.add:disabled{opacity:.4;cursor:default}
.add svg{width:12px;height:12px;stroke:var(--frost);stroke-width:2;fill:none}
.add[hidden]{display:none}
.tot{color:var(--frost3);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stage.busy .dock::before{content:"";position:absolute;left:18px;right:18px;top:30px;height:1px;
  background:linear-gradient(90deg,transparent,var(--frost),transparent) no-repeat;
  background-size:40% 100%;animation:scan 1s linear infinite}
.hint{margin:10px 2px 0;color:var(--frost3);font-size:12px;line-height:1.5}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:0 24px;text-align:center;
  color:var(--frost3);font-size:13px;z-index:1}
.fallback[hidden]{display:none}
:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
@keyframes pour{from{clip-path:inset(0 100% 0 0 round 6px)}to{clip-path:inset(0 0 0 0 round 6px)}}
@keyframes scan{from{background-position:-40% 0}to{background-position:140% 0}}
@keyframes beat{50%{opacity:.45}}
@media (max-width:640px){
  .probe{top:10px;left:10px;min-width:0;padding:8px 11px 8px}
  .p-k,.p-s{display:none}
  .p-t{margin:0 0 6px}
  .p-t b{font-size:22px}
  .p-g{font-size:11px;gap:3px 10px}
  .views{top:10px;right:10px}
  .seg button{padding:5px 9px;font-size:11.5px}
  .scale{display:none}
  .dock{grid-template-columns:auto minmax(0,1fr);gap:12px;padding:34px 12px 10px}
  .dock-r{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .lbl span,.lbl b{font-size:10px}
  .cmp{top:48px;right:10px}
  .cmp p{display:none}
  .cmp .seg button{padding:5px 8px}
  .tk-z div{font-size:9.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="gl" tabindex="0" role="img"></canvas>
  <div class="labels" id="labels"></div>
  <div class="fallback" id="fallback" hidden></div>
  <section class="probe" aria-live="polite">
    <div class="p-k" id="pk"></div>
    <div class="p-t"><b id="pt">0.0</b><span id="pmin"></span></div>
    <dl class="p-g">
      <dt id="ls"></dt><dd><i id="isw"></i><span id="ps"></span></dd>
      <dt id="lc"></dt><dd><i id="icw"></i><span id="pc"></span></dd>
      <dt id="ld"></dt><dd><span id="pd"></span><small id="pr"></small></dd>
    </dl>
    <div class="p-s" id="pst"></div>
  </section>
  <div class="views">
    <div class="seg" role="group" id="views"></div>
    <div class="scale"><span>15 °C</span><i id="scale"></i><span>100 °C</span></div>
  </div>
  <div class="cmp" id="cmp" hidden><div class="seg" role="group" id="cmpb"></div><p id="cmpc"></p></div>
  <div class="dock">
    <button class="play" id="play" type="button"></button>
    <div class="track" id="track">
      <div class="tk-b" id="tb"></div>
      <div class="tk-d" id="dl"></div>
      <div class="tk-band" id="band"></div>
      <div class="tk-z" id="tz"></div>
      <div class="tk-h" id="head" role="slider" tabindex="0" aria-valuemin="0"><i></i></div>
    </div>
    <div class="dock-r">
      <button class="add" id="add" type="button" hidden>
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10"/></svg><span></span>
      </button>
      <span class="tot" id="tot"></span>
    </div>
  </div>
</div>
<p class="hint" id="hint"></p>

<script type="module">
// ── Small helpers ────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (s, o) => String(s).replace(/\{(\w+)\}/g, (_, k) => (k in o ? o[k] : ""));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CYCLE_S = 24;           // one full cycle plays in 24 s
const MAX_BURSTS = 12;

// ── Streamlit component protocol v1 (no npm library needed) ─────────────────
const send = (type, data = {}) =>
  window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
window.addEventListener("message", e => {
  if (e.data && e.data.type === "streamlit:render") onRender(e.data.args || {});
});
send("streamlit:componentReady", { apiVersion: 1 });

// ── State ────────────────────────────────────────────────────────────────────
let D = null;        // data from Python
let L = {};          // labels in the active language
let bursts = [];     // editable hot-air bursts: {s: start min, d: length s}
let sel = -1;        // selected burst
let hov = -1;        // hovered burst (3D)
let probe = 0;       // time under the probe, min
let flow = 0;        // conveyor phase, min
let playing = !reduced;
let drag = null;     // the gesture in progress
let pending = null;  // data that arrived during a gesture
let dirty = true;    // the 3D view needs a redraw
let view = "overview";
let THREE = null, W = null;

// ── Heat ramp (same stops as the dashboard) ─────────────────────────────────
let STOPS = [];
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function heatRGB(T) {
  const s = STOPS;
  if (T <= s[0][0]) return s[0][1];
  for (let i = 1; i < s.length; i++) {
    if (T <= s[i][0]) {
      const f = (T - s[i - 1][0]) / (s[i][0] - s[i - 1][0]);
      return s[i - 1][1].map((c, k) => c + (s[i][1][k] - c) * f);
    }
  }
  return s[s.length - 1][1];
}
const heatHex = T => "#" + heatRGB(T).map(c => Math.round(c).toString(16).padStart(2, "0")).join("");
function riskOf(di) {
  for (const [th, col, name] of D.risk) if (di >= th) return { col, name };
  const z = D.risk[D.risk.length - 1];
  return { col: z[1], name: z[2] };
}

// ── Time series and the time <-> belt mapping ───────────────────────────────
function sample(arr, t) {
  const ts = D.times; let lo = 0, hi = ts.length - 1;
  if (t <= ts[0]) return arr[0];
  if (t >= ts[hi]) return arr[hi];
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ts[m] <= t) lo = m; else hi = m; }
  const f = (t - ts[lo]) / (ts[hi] - ts[lo] || 1);
  return arr[lo] + (arr[hi] - arr[lo]) * f;
}
// Top lane = the cooling zones (0 .. t_cool); the U-turn and the return lane
// carry the rest of the cycle, in proportion to their length.
function posAt(t) {
  const { L: Lx, r } = D.geo, tc = D.tc, tt = D.tt, arc = Math.PI * r;
  if (t <= tc) return [t / tc * Lx, -r];
  const f = (t - tc) / Math.max(tt - tc, 1e-6) * (arc + Lx);
  if (f <= arc) { const a = f / r; return [Lx + r * Math.sin(a), -r * Math.cos(a)]; }
  return [Lx - (f - arc), r];
}
let PATH = [];
function buildPath() {
  PATH = [];
  for (let i = 0; i <= 720; i++) { const t = D.tt * i / 720; const [x, z] = posAt(t); PATH.push([t, x, z]); }
}
function timeNear(x, z) {
  let best = 0, bd = Infinity;
  for (const [t, px, pz] of PATH) { const d = (px - x) ** 2 + (pz - z) ** 2; if (d < bd) { bd = d; best = t; } }
  return { t: best, d: Math.sqrt(bd) };
}
const xToT = x => clamp(x / D.geo.L * D.tc, 0, D.tc);

// Process segments: cooling zones, the sequential reheat leg, final cooling.
function segments() {
  const out = []; let acc = 0;
  D.zones.forEach((z, k) => {
    out.push({ a: acc, b: acc + z.d, name: fmt(L.zone, { n: k + 1 }), T: z.T }); acc += z.d;
  });
  if (D.mode === "sequential" && D.seq) {
    out.push({ a: acc, b: D.seq[1], name: L.reheat, T: D.Tair, hot: true }); acc = D.seq[1];
  }
  out.push({ a: acc, b: D.tt, name: L.final, T: D.late });
  return out.filter(s => s.b > s.a + 1e-6);
}
function hotSpans() {
  if (D.mode === "pulsed") return bursts.map((b, i) => ({ a: b.s, b: b.s + b.d / 60, i }));
  return (D.spans || []).map(([a, b]) => ({ a, b, i: -1 }));
}
const hotAt = t => hotSpans().some(h => t >= h.a && t < h.b);
const pct = v => (100 * v / D.tt).toFixed(3) + "%";

// ── DOM: probe read-out, track, views ───────────────────────────────────────
const stage = $("stage"), track = $("track"), head = $("head"), tb = $("tb");
const PLAY = "<svg viewBox='0 0 14 14'><path d='M3 1.5v11l9.5-5.5z'/></svg>";
const PAUSE = "<svg viewBox='0 0 14 14'><path d='M2.5 1.5h3v11h-3zM8.5 1.5h3v11h-3z'/></svg>";

function setPlaying(p) {
  playing = p;
  $("play").innerHTML = p ? PAUSE : PLAY;
  $("play").setAttribute("aria-label", p ? L.pause : L.play);
  dirty = true;
}
function setProbe(t) { probe = clamp(t, 0, D.tt); updateProbe(); dirty = true; }

function staticText() {
  $("pk").textContent = L.time_k; $("pmin").textContent = L.min;
  $("ls").textContent = L.surface; $("lc").textContent = L.core; $("ld").textContent = L.damage;
  $("gl").setAttribute("aria-label", L.canvas);
  head.setAttribute("aria-label", L.slider);
  $("add").querySelector("span").textContent = L.add;
  $("scale").style.background = "linear-gradient(90deg," +
    STOPS.map(([T]) => `${heatHex(T)} ${(100 * (T - 15) / 85).toFixed(0)}%`).join(",") + ")";
  $("views").setAttribute("aria-label", L.views);
  $("views").innerHTML = ["overview", "top", "follow"].map(v =>
    `<button type="button" data-v="${v}" aria-pressed="${v === view}">${L[v]}</button>`).join("");
  $("fallback").textContent = L.nogl;
  setPlaying(playing);
}

function updateProbe() {
  if (!D) return;
  const t = probe, Ts = sample(D.Ts, t), Tc = sample(D.Tc, t), di = sample(D.DI, t), rk = riskOf(di);
  $("pt").textContent = t.toFixed(1);
  $("ps").textContent = Ts.toFixed(0) + " °C"; $("isw").style.background = heatHex(Ts);
  $("pc").textContent = Tc.toFixed(0) + " °C"; $("icw").style.background = heatHex(Tc);
  $("pd").textContent = di.toFixed(3); $("pd").style.color = rk.col; $("pr").textContent = rk.name;
  const hot = hotAt(t), cracked = di >= .25, seg = segments().find(s => t >= s.a && t <= s.b) || {};
  const pst = $("pst");
  pst.textContent = hot ? (cracked ? L.healing : (D.mode === "sequential" ? L.tunnel_on : L.hot_on))
                        : (cracked ? L.cracks : (seg.name || ""));
  pst.classList.toggle("hot", hot);
  pst.classList.toggle("crack", cracked && !hot);
  head.style.left = pct(t);
  head.setAttribute("aria-valuemax", D.tt.toFixed(1));
  head.setAttribute("aria-valuenow", t.toFixed(1));
  head.setAttribute("aria-valuetext", `${t.toFixed(1)} ${L.min}`);
}

function drawTrack() {
  const n = 72, stops = [];
  for (let i = 0; i <= n; i++) {
    const tm = D.tt * i / n;
    stops.push(`${heatHex(sample(D.Ts, tm))} ${(100 * i / n).toFixed(2)}%`);
  }
  $("band").style.background = `linear-gradient(90deg,${stops.join(",")})`;
  // Damage lane: area of the damage index, coloured by risk; dashed line = 0.25.
  const m = 160, mx = Math.max(.6, Math.max(...D.DI) * 1.08), gs = [];
  let p = "M0 100";
  for (let i = 0; i <= m; i++) {
    const v = sample(D.DI, D.tt * i / m);
    p += ` L${(1000 * i / m).toFixed(1)} ${(100 - 100 * v / mx).toFixed(1)}`;
    gs.push(`<stop offset="${(i / m).toFixed(4)}" stop-color="${riskOf(v).col}"/>`);
  }

    e.preventDefault(); Cg.rad = clamp(Cg.rad * Math.exp(e.deltaY * .0025), 14, 170); dirty = true;

  canvas.addEventListener("keydown", e => {
    const k = { ArrowLeft: [-.12, 0], ArrowRight: [.12, 0], ArrowUp: [0, -.08], ArrowDown: [0, .08] }[e.key];
    if (k) { Cg.th += k[0]; Cg.ph = clamp(Cg.ph + k[1], .06, 1.42); dirty = true; e.preventDefault(); }
    if (e.key === "+" || e.key === "=") { Cg.rad = clamp(Cg.rad * .88, 14, 170); dirty = true; }
    if (e.key === "-") { Cg.rad = clamp(Cg.rad * 1.12, 14, 170); dirty = true; }
  });
}

// ── Loop: draws only while something moves ──────────────────────────────────
let last = performance.now(), visible = true;
new IntersectionObserver(es => { visible = es[es.length - 1].isIntersecting; dirty = true; }).observe(stage);
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  // Off screen: hold the animation, but still draw one-off changes.
  if (!W || !D || document.hidden || (!visible && !dirty)) return;
  let active = dirty;
  if (playing && !drag) {
    const adv = dt * D.tt / CYCLE_S;
    probe = (probe + adv) % D.tt; flow = (flow + adv) % D.tt;
    updateProbe(); animateJets(dt); active = true;
  }
  if (camUpdate(dt)) active = true;
  if (!active) return;
  placeSticks(); placeHero(); placeLabels();
  W.renderer.render(W.scene, W.camera);
  dirty = false;
}
// Exposed for automated checks (Playwright): read-only snapshot of the state.
window.__studio = () => ({ ready: !!W, probe, playing, bursts: bursts.map(b => [b.s, b.d]), sel, view,
  mode: D && D.mode, alt, heroCrack: W ? W.heroCrack || 0 : 0,
  peakT: D ? D.times[D.DI.indexOf(Math.max(...D.DI))] : 0 });
window.__studioXY = (what, i) => {     // screen point of the hero stick or nozzle i
  const o = what === "hero" ? W.hero.g : W.nozzles.find(n => n.userData.burst === i);
  const v = o.position.clone().setY(what === "hero" ? D.geo.H * .6 : D.geo.H + 2.05).project(W.camera);
  const r = $("gl").getBoundingClientRect();
  return [(v.x + 1) / 2 * r.width + r.left, (1 - v.y) / 2 * r.height + r.top];
};
